# Render Blueprint. In Render: New > Blueprint > pick this repo.
# Choose instance and database plans in the Render dashboard when prompted.
services:
  - type: web
    name: rishari-positioning-studio
    runtime: node
    plan: starter
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: clerk
      - key: DATABASE_URL
        fromDatabase:
          name: rishari-db
          property: connectionString
      - key: DOWNLOAD_SIGNING_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # Uploaded documents live on the Render disk above. Render backs up disks with daily snapshots.
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /var/data/uploads
      - key: STORAGE_PERSISTENT_DISK
        value: "true"
      - key: AI_ENABLED
        value: "false"

databases:
  - name: rishari-db
    databaseName: rishari
    plan: basic-256mb
