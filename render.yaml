# Render Blueprint. In Render: New > Blueprint > pick this repo.
# Choose instance and database plans in the Render dashboard when prompted.
services:
  - type: web
    name: rishari-positioning-studio
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: clerk
      - key: DATABASE_URL
        fromDatabase:
          name: rishari-db
          property: connectionString
      - key: DOWNLOAD_SIGNING_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: AI_ENABLED
        value: "false"

databases:
  - name: rishari-db
    databaseName: rishari
